# Single source of tool versions for the devcontainer and for CI.
[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
kind = "0.33.0"
kubectl = "1.37.1"
helm = "4.3.1"
"aqua:kyverno/chainsaw" = "0.2.15"
crossplane = "2.5.0"
flux2 = "2.10.0"
argocd = "3.5.6"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
trivy = "0.76.1"
gomplate = "5.3.1"
syft = "1.55.0"
cosign = "3.1.4"
jq = "1.8.2"

[tasks."owui:up"]
description = "Start a throwaway Open WebUI instance: mise run owui:up <version>"
run = "hack/openwebui/up.sh"

[tasks."owui:down"]
description = "Tear down a throwaway Open WebUI instance: mise run owui:down <version>"
run = "hack/openwebui/down.sh"

[tasks."owui:openapi"]
description = "Snapshot /openapi.json of a running instance: mise run owui:openapi <version>"
run = "hack/openwebui/openapi.sh"

[tasks."owui:capture"]
description = "Capture API fixtures on a fresh instance: mise run owui:capture <resource> <version>"
run = "hack/capture/capture.sh"

[tasks."owui:openapi-diff"]
description = "Diff the provider's routes between two OpenAPI snapshots: mise run owui:openapi-diff [from] [to]"
run = "hack/openwebui/openapi-diff.sh"

[tasks.e2e]
description = "Build the provider and run the e2e suite on a fresh kind cluster: mise run e2e [version...]"
run = "hack/e2e/run.sh"

[tasks."e2e:up"]
description = "Create the e2e cluster (kind, registry, Crossplane), or bring it up to date"
run = "hack/e2e/up.sh"

[tasks."e2e:deploy"]
description = "Install the package of the last make build into the e2e cluster"
run = "hack/e2e/deploy.sh"

[tasks."e2e:test"]
description = "Run the e2e suite against one Open WebUI version: mise run e2e:test <version> [chainsaw flags]"
run = "hack/e2e/test.sh"

[tasks."e2e:down"]
description = "Delete the e2e cluster and its registry"
run = "hack/e2e/down.sh"

[tasks.contract]
description = "Run the contract tests against fresh Open WebUI instances: mise run contract [version...]"
run = "hack/contract/run.sh"

[tasks."contract:record"]
description = "Run the contract tests and regenerate their fixtures: mise run contract:record [version...]"
run = "hack/contract/run.sh --record"
