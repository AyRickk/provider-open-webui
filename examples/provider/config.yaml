apiVersion: v1
kind: Namespace
metadata:
  name: default
---
# The API key of a dedicated Open WebUI admin account. Supply it with External Secrets or
# SOPS rather than committing it.
apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: openwebui-api-key
type: Opaque
stringData:
  token: sk-replace-me
---
apiVersion: openwebui.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: example
  namespace: default
spec:
  url: http://open-webui.open-webui.svc:8080
  apiKeySecretRef:
    name: openwebui-api-key
    key: token
---
apiVersion: openwebui.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  url: http://open-webui.open-webui.svc:8080
  apiKeySecretRef:
    namespace: default
    name: openwebui-api-key
    key: token
